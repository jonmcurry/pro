[package]
name = "pro-service"
version.workspace = true
edition.workspace = true

[dependencies]
pro-worker = { path = "../pro-worker" }
pro-common = { path = "../pro-common" }
pro-db = { path = "../pro-db" }
pro-parser-csv = { path = "../pro-parser-csv" }
pro-parser-edi = { path = "../pro-parser-edi" }
pro-npi-enrichment = { path = "../pro-npi-enrichment" }
pro-upgrade-manager = { path = "../pro-upgrade-manager" }
pro-rules = { path = "../pro-rules" }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }

# Web framework (for WebSocket API)
axum = { workspace = true }

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# UUIDs
uuid = { workspace = true }

# Windows service
windows-service = "0.7"

# Configuration
dotenvy = { workspace = true }
config = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Date/Time
chrono = { workspace = true }

# CLI
clap = { workspace = true }

# File watching
notify = "6.1"

# CSV parsing
csv = { workspace = true }

# Decimal numbers
rust_decimal = "1.36"

# Hashing (for file deduplication)
sha2 = "0.10"

# Random number generation (for jitter in retry logic)
rand = { workspace = true }

# Thread-safe lazy initialization
once_cell = "1.19"

# Parallel iteration for CPU-bound rule execution
rayon = { workspace = true }

[dev-dependencies]
tempfile = "3.8"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winsvc", "winbase", "winerror", "winnt"] }
