[package]
name = "pro-setup"
version.workspace = true
edition.workspace = true

[dependencies]
pro-common = { path = "../pro-common" }

# CLI and User Interaction
dialoguer = { version = "0.11", features = ["password"] }
console = "0.15"
indicatif = "0.17"

# Database
sqlx = { workspace = true }

# Configuration
dotenvy = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true }

# HTTP client (for downloading PostgreSQL)
reqwest = { workspace = true }

# File operations
tempfile = "3.8"

# Serialization
serde = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# System
num_cpus = "1.16"
