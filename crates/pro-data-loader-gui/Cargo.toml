[package]
name = "pro-data-loader-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "GUI for Professional SMART Master Data Loader"

[[bin]]
name = "pro-data-loader-gui"
path = "src/main.rs"

[dependencies]
pro-data-loader = { path = "../pro-data-loader" }
anyhow = "1.0"
# GUI - using wgpu backend for Windows Server 2019 compatibility
# wgpu can use DirectX 12 WARP (software renderer) when GPU is unavailable
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui = "0.28"
rfd = "0.14"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync"] }
chrono = "0.4"
