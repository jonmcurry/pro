[package]
name = "pro-data-loader-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "GUI for Professional SMART Master Data Loader"

[[bin]]
name = "pro-data-loader-gui"
path = "src/main.rs"

[dependencies]
pro-data-loader = { path = "../pro-data-loader" }
anyhow = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync"] }
chrono = { version = "0.4.38", default-features = false, features = ["serde", "std", "clock"] }

# Modern GUI with egui/eframe using wgpu backend
# wgpu supports software rendering via llvmpipe/lavapipe on systems without GPU
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.31"
rfd = "0.15"  # Native file dialogs
