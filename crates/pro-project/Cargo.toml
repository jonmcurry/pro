[package]
name = "pro-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Professional SMART Project Database Manager - CLI and GUI tool for managing multiple project databases"

[[bin]]
name = "pro-project"
path = "src/main.rs"

[dependencies]
# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Error handling & logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration
dotenvy = { workspace = true }

# GUI - Native Windows GUI (NWG) for Windows Server compatibility
# Uses Win32 GDI controls - no GPU required, works on all Windows versions
# high-dpi feature enables scale_factor() to return actual DPI scaling ratio
native-windows-gui = { version = "1.0.13", features = ["list-view", "high-dpi", "rich-textbox"] }
native-windows-derive = "1.0.5"

# Internal dependencies
pro-upgrade-manager = { path = "../pro-upgrade-manager" }

# Windows service control
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

# Build dependency for embedding Windows manifest
# Required for Common Controls v6 to resolve GetWindowSubclass error
# See: https://github.com/gabdube/native-windows-gui/issues/251
[build-dependencies]
embed-resource = "2.5"
