[package]
name = "pro-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Professional SMART Project Database Manager - CLI and GUI tool for managing multiple project databases"

[[bin]]
name = "pro-project"
path = "src/main.rs"

[dependencies]
# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Error handling & logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration
dotenvy = { workspace = true }

# GUI - using glow backend for Windows Server compatibility (software rendering fallback)
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["all_loaders"] }
rfd = "0.14"

# Internal dependencies
pro-upgrade-manager = { path = "../pro-upgrade-manager" }

# Windows service control
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
